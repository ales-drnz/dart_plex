# The integration suites need the Docker PMS (test/integration/README.md)
# and race each other in parallel (timeline and playQueue writes), so a
# plain `dart test` skips them. Run everything, one file at a time, with:
#
#     dart test -P integration
#
# and only the integration suites with `dart test -P integration --tags
# integration`.
tags:
  integration:
    skip: 'needs the Docker PMS: run with -P integration'
  # Read-only checks against a server named by environment variables
  # (see test/live_server_test.dart).
  live:

presets:
  integration:
    concurrency: 1
    tags:
      integration:
        skip: false
